<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # 201-file documents and scans are served only through document.php,
    # which checks who may open them -- never directly by URL.
    <Directory /var/www/html/uploads>
        Require all denied
    </Directory>
    <Directory /var/www/html/temp_scans>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
