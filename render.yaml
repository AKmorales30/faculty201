services:
  - type: web
    name: faculty201-repository
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Supabase: the Session pooler connection string (config/database.example.php).
      # When set, it is used instead of the DB_* values below.
      - key: DATABASE_URL
        sync: false
      - key: DB_DRIVER
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Email for the login codes, email verification and password reset
      # (config/mail.example.php has the Google setup). Two-factor
      # authentication is optional: without working email, accounts with 2FA
      # off still log in, but 2FA logins, email setup and Forgot password
      # can't send codes. Gmail API: the OAuth client and refresh token, and
      # MAIL_FROM_EMAIL = the Gmail address that authorized it.
      # (Postmark / SendGrid instead: MAIL_PROVIDER and their key.)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM_EMAIL
        value: "udmccsfaculty201.ms@gmail.com"
      - key: MAIL_FROM_NAME
        value: "Faculty-201 File Management System"
      # Login Activity: approximate location of a login's IP address from
      # ipinfo.io (free token from ipinfo.io/signup). Without it the location
      # is shown as "unknown" and everything else works.
      - key: IPINFO_TOKEN
        sync: false
      # AI features (config/ai.example.php); without it AI is off and everything else works
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "1"
