services:
  - type: web
    name: faculty201-repository
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Supabase: the Session pooler connection string (config/database.example.php).
      # When set, it is used instead of the DB_* values below.
      - key: DATABASE_URL
        sync: false
      - key: DB_DRIVER
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_BASE_URL
        sync: false
      # AI features (config/ai.example.php); without it AI is off and everything else works
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "1"
